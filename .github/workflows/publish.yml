name: Publish npm packages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Inspect package contents and registry versions without publishing
        type: boolean
        default: true
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: node --test scripts/publish-packages.test.mjs
      - name: Review or publish core, CLI, MCP server, and hooks
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          # Optional fallback; npm also supports a configured trusted publisher.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            node scripts/publish-packages.mjs --dry-run
          else
            node scripts/publish-packages.mjs --publish
          fi
